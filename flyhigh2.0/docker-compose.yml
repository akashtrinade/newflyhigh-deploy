# FlyHigh 2.0 — Local Development Stack
#
# Quick start:
#   1. Copy .env.example to .env (or set env vars below)
#   2. docker-compose up -d
#   3. UI:     http://localhost:5173
#      API:    http://localhost:8081
#      WS:     ws://localhost:5000
#
# Optional: use MongoDB Atlas instead of local mongo
#   - Leave mongo service commented out
#   - Set MONGODB_URI in .env to your Atlas SRV string

services:
  # ── MongoDB (local dev) ───────────────────────────────
  mongo:
    image: mongo:7
    container_name: flyhigh-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: flyhigh_dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ──────────────────────────────
  backend:
    build:
      context: ./flyhigh-backend
      dockerfile: Dockerfile
    container_name: flyhigh-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/flyhigh_dev}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - SERVER_PORT=8081
      - BCRYPT_STRENGTH=${BCRYPT_STRENGTH:-4}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Signaling Server ─────────────────────────────────
  signaling:
    build:
      context: ./flyhigh-signaling-server
      dockerfile: Dockerfile
    container_name: flyhigh-signaling
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped

  # ── React UI (Vite dev server) ───────────────────────
  ui:
    build:
      context: ./flyhigh-ui
      dockerfile: Dockerfile.dev
    container_name: flyhigh-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8081/api
      - VITE_WEBSOCKET_URL=ws://localhost:5000
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./flyhigh-ui/src:/app/src
      - ./flyhigh-ui/public:/app/public
      - ./flyhigh-ui/index.html:/app/index.html
    depends_on:
      - backend
      - signaling
    restart: unless-stopped

volumes:
  mongo-data:
