name: Deploy FlyHigh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  # Override via GitHub Variables (repo-level) for multi-region deployments.
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

# ── Concurrency: only one deploy per ref at a time ──
# Prevents CloudFormation UPDATE_ROLLBACK failures from overlapping deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════
  # Stage 1: Build & Test (polyglot matrix)
  # ═══════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            path: flyhigh-ui
            setup: |
              uses: actions/setup-node@v4
              with: { node-version: '22', cache: 'npm', cache-dependency-path: flyhigh-ui/package-lock.json }
            build: npm ci && npm run build
            test: npm run typecheck
            upload-path: flyhigh-ui/dist
            upload-name: frontend-dist

          - name: backend
            path: flyhigh-backend
            setup: |
              uses: actions/setup-java@v4
              with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
            build: ./mvnw package -DskipTests --no-transfer-progress
            test: ./mvnw test --no-transfer-progress
            upload-path: flyhigh-backend/target/flyhigh-backend-0.0.1-SNAPSHOT.jar
            upload-name: backend-jar

          - name: signaling
            path: flyhigh-signaling-server
            setup: |
              uses: actions/setup-node@v4
              with: { node-version: '22', cache: 'npm', cache-dependency-path: flyhigh-signaling-server/package-lock.json }
            build: npm ci
            # Syntax check + basic functional test for signaling server
            test: |
              node --check server.js
              node --check lambda.js
              node -e "
                const { handler } = require('./lambda.js');
                if (typeof handler !== 'function') {
                  console.error('ERROR: lambda.js does not export a handler function');
                  process.exit(1);
                }
                console.log('OK: lambda.js exports handler function');
              "
            upload-name: ''  # signaling is deployed via CDK from source

    steps:
      - uses: actions/checkout@v4

      - name: Setup ${{ matrix.name }}
        uses: ${{ matrix.setup }}

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.build }}

      - name: Test ${{ matrix.name }}
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.test }}

      - name: Upload build artifact (${{ matrix.name }})
        if: matrix.upload-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload-name }}
          path: ${{ matrix.upload-path }}
          retention-days: 1

  # ═══════════════════════════════════════════════════════════
  # Stage 2: CDK Diff (PR only, both environments)
  # ═══════════════════════════════════════════════════════════
  cdk-diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK deps
        working-directory: infra
        run: npm ci

      # app-stack.ts references the backend JAR via Code.fromAsset at synth time —
      # without the artifact the synth (and thus the diff) fails.
      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: flyhigh-backend/target/

      - name: Type-check CDK
        working-directory: infra
        run: npx tsc --noEmit

      - name: CDK Synth (${{ matrix.environment }})
        working-directory: infra
        run: npx cdk synth --all --context env=${{ matrix.environment }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-cdk
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff (${{ matrix.environment }})
        id: cdk-diff
        working-directory: infra
        run: |
          DIFF=$(npx cdk diff --all --context env=${{ matrix.environment }} 2>&1)
          echo "$DIFF" | tee cdk-diff-${{ matrix.environment }}.txt
          {
            echo 'diff<<EOF'
            echo "$DIFF"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Post diff as PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cdk-diff-${{ matrix.environment }}
          recreate: true
          message: |
            ## Infrastructure Changes (${{ matrix.environment }})
            ```diff
            ${{ steps.cdk-diff.outputs.diff }}
            ```

  # ═══════════════════════════════════════════════════════════
  # Stage 3: Deploy Staging
  # ═══════════════════════════════════════════════════════════
  # Runs on push to main OR an explicit workflow_dispatch targeting staging.
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.flyhigh.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK deps
        working-directory: infra
        run: npm ci

      - name: Type-check CDK
        working-directory: infra
        run: npx tsc --noEmit

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: flyhigh-backend/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-cdk
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy Staging
        working-directory: infra
        run: npx cdk deploy --all --context env=staging --require-approval never

      - name: Get SPA bucket name
        id: outputs
        working-directory: infra
        run: |
          echo "bucket=$(aws cloudformation describe-stacks --stack-name flyhigh-app-staging --query 'Stacks[0].Outputs[?OutputKey==`SpaBucketName`].OutputValue' --output text)" >> $GITHUB_OUTPUT
          echo "distribution=$(aws cloudformation describe-stacks --stack-name flyhigh-app-staging --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)" >> $GITHUB_OUTPUT

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: flyhigh-ui/dist/

      - name: Upload SPA to S3
        working-directory: flyhigh-ui
        env:
          VITE_API_BASE: https://api.staging.flyhigh.com/api
          VITE_WEBSOCKET_URL: wss://ws.staging.flyhigh.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          # Rebuild SPA with env-specific vars (dist/ is from build-and-test, we need env-specific build)
          npm ci
          npm run build
          aws s3 sync dist/ s3://${{ steps.outputs.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.distribution }} \
            --paths "/*"

      - name: Smoke Test (SPA + API + WebSocket)
        env:
          SPA_URL: https://staging.flyhigh.com/
          API_URL: https://api.staging.flyhigh.com/api/health
          WS_URL: https://ws.staging.flyhigh.com/
        run: |
          echo "Waiting for CloudFront propagation (30s)..."
          sleep 30

          echo "── SPA (CloudFront) ──"
          SPA_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 "$SPA_URL" || echo "000")
          if [ "$SPA_CODE" != "200" ]; then
            echo "SMOKE TEST FAILED: SPA returned HTTP $SPA_CODE"
            exit 1
          fi
          echo "OK: SPA returns HTTP $SPA_CODE"

          echo "── Backend API (/health) ──"
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 "$API_URL" || echo "000")
          if [ "$API_CODE" != "200" ]; then
            echo "SMOKE TEST FAILED: API health returned HTTP $API_CODE"
            exit 1
          fi
          echo "OK: API health returns HTTP $API_CODE"

          echo "── Signaling WebSocket endpoint (TLS reachability) ──"
          WS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$WS_URL" || echo "000")
          # API Gateway WebSocket returns 403/426 (not 000) for non-WS requests —
          # any real HTTP code means the TLS handshake + endpoint are reachable.
          if [ "$WS_CODE" = "000" ]; then
            echo "SMOKE TEST FAILED: WebSocket endpoint unreachable (HTTP $WS_CODE)"
            exit 1
          fi
          echo "OK: WebSocket endpoint reachable (HTTP $WS_CODE)"

          echo "SMOKE TEST PASSED"

  # ═══════════════════════════════════════════════════════════
  # Stage 4: Deploy Production
  # ═══════════════════════════════════════════════════════════
  # Runs on push to main (after staging) OR an explicit workflow_dispatch
  # targeting production. The `environment: production` block enforces any
  # required reviewers/approvals configured on the production environment.
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://flyhigh.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK deps
        working-directory: infra
        run: npm ci

      - name: Type-check CDK
        working-directory: infra
        run: npx tsc --noEmit

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: flyhigh-backend/target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-cdk
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy Production
        working-directory: infra
        run: npx cdk deploy --all --context env=production --require-approval never

      - name: Get SPA bucket name
        id: outputs
        working-directory: infra
        run: |
          echo "bucket=$(aws cloudformation describe-stacks --stack-name flyhigh-app-production --query 'Stacks[0].Outputs[?OutputKey==`SpaBucketName`].OutputValue' --output text)" >> $GITHUB_OUTPUT
          echo "distribution=$(aws cloudformation describe-stacks --stack-name flyhigh-app-production --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)" >> $GITHUB_OUTPUT

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: flyhigh-ui/dist/

      - name: Upload SPA to S3
        working-directory: flyhigh-ui
        env:
          VITE_API_BASE: https://api.flyhigh.com/api
          VITE_WEBSOCKET_URL: wss://ws.flyhigh.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          aws s3 sync dist/ s3://${{ steps.outputs.outputs.bucket }}/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.outputs.outputs.distribution }} \
            --paths "/*"

      - name: Smoke Test (SPA + API + WebSocket)
        env:
          SPA_URL: https://flyhigh.com/
          API_URL: https://api.flyhigh.com/api/health
          WS_URL: https://ws.flyhigh.com/
        run: |
          echo "Waiting for CloudFront propagation (30s)..."
          sleep 30

          echo "── SPA (CloudFront) ──"
          SPA_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 "$SPA_URL" || echo "000")
          if [ "$SPA_CODE" != "200" ]; then
            echo "SMOKE TEST FAILED: SPA returned HTTP $SPA_CODE"
            exit 1
          fi
          echo "OK: SPA returns HTTP $SPA_CODE"

          echo "── Backend API (/health) ──"
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 "$API_URL" || echo "000")
          if [ "$API_CODE" != "200" ]; then
            echo "SMOKE TEST FAILED: API health returned HTTP $API_CODE"
            exit 1
          fi
          echo "OK: API health returns HTTP $API_CODE"

          echo "── Signaling WebSocket endpoint (TLS reachability) ──"
          WS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$WS_URL" || echo "000")
          if [ "$WS_CODE" = "000" ]; then
            echo "SMOKE TEST FAILED: WebSocket endpoint unreachable (HTTP $WS_CODE)"
            exit 1
          fi
          echo "OK: WebSocket endpoint reachable (HTTP $WS_CODE)"

          echo "SMOKE TEST PASSED"
