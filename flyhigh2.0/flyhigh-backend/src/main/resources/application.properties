spring.application.name=flyhigh-backend
server.port=${SERVER_PORT:8081}

# ── Profiles ── (set SPRING_PROFILES_ACTIVE=prod for AWS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── MongoDB Atlas ──
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/flyhigh_dev}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:false}

# ── Mail (Gmail SMTP) ──
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dev@localhost}
spring.mail.password=${MAIL_PASSWORD:dev-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.debug=false

# ── JWT ──
jwt.secret=${JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRY:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRY:604800000}

# ── OTP ──
otp.length=${OTP_LENGTH:6}
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:3}

# ── Admin ──
app.admin.email=${ADMIN_EMAIL:admin@flyhigh.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ── BCrypt ──
bcrypt.strength=${BCRYPT_STRENGTH:12}

# ── Security ──
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Controls Secure flag on JWT cookies — set COOKIE_SECURE=false in .env for local HTTP dev
app.cookie.secure=${COOKIE_SECURE:true}

# ── CORS (comma-separated origins) ──
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Logging ──
logging.level.com.flyhigh=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# ── Google OAuth ──
google.client-id=${GOOGLE_CLIENT_ID:dev-client-id}
google.client-secret=${GOOGLE_CLIENT_SECRET:dev-client-secret}

# ── WebSocket / Signaling ──
app.signaling.websocket-endpoint=${WEBSOCKET_API_ENDPOINT:http://localhost:5000}

# ── Razorpay ──
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_DevPlaceholderKey00000}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:DevPlaceholderSecret00000000000000000}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.commission.percent=${RAZORPAY_COMMISSION_PERCENT:20}

# ── Platform Commission ──
platform.commission.percent=${PLATFORM_COMMISSION_PERCENT:20}

# ── Pricing ──
pricing.rate-change-days=${PRICING_RATE_CHANGE_DAYS:14}

# ── Session ──
session.free-trial-seconds=${SESSION_FREE_TRIAL_SECONDS:300}
session.extend-prompt-seconds=${SESSION_EXTEND_PROMPT_SECONDS:300}

# ── Socket.IO Payment Server ──
socketio.payment.port=${SOCKETIO_PORT:8085}

# ── Security Headers ──
app.security.hsts-max-age=${HSTS_MAX_AGE:31536000}
app.security.csp-policy=${CSP_POLICY:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.razorpay.com wss:; frame-src 'self' https://api.razorpay.com; font-src 'self'}

# ── Resilience4j (payment gateway hardening) ──
# Circuit breaker prevents cascading failures when Razorpay is degraded.
# Retry with exponential backoff handles transient network errors and rate limits
# without overwhelming the gateway.
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.exponential-backoff-multiplier=2

# ── Actuator (health checks for AWS / K8s) ──
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=true
# Keep health checks lightweight for Lambda cold starts
management.health.defaults.enabled=false
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo
# Health endpoints should be accessible without auth
management.endpoints.web.path-mapping.health=/health
management.endpoints.web.path-mapping.info=/info
